<rect x="1030" y="640" width="60" height="70" rx="6" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="3" />
<text x="1060" y="740" font-size="26" text-anchor="middle" font-weight="700" fill="#1c2a4a" >2–4 kg</text></g>
<path d="M552 340 L700 412" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="700" cy="412" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="560" y="350" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >esparadrapo ou espuma adesiva dos dois</text>
<text x="560" y="378" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >lados, do joelho ao tornozelo; atadura</text>
<path d="M752 650 L909 545" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="909" cy="545" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="760" y="660" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >barra no pé, longe</text>
<text x="760" y="688" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >do maléolo</text>
<circle cx="80" cy="141" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="102" y="150" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >pele íntegra, sem úlcera; não no idoso de pele fina</text>
<circle cx="80" cy="177" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="102" y="186" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >peso ~10% do corpo, nunca mais de 5 kg</text>
<circle cx="80" cy="213" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="102" y="222" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >pulso, pele sob o esparadrapo e nervo fibular 2×/dia</text>
<circle cx="80" cy="249" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="102" y="258" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >é analgesia até a cirurgia, não tratamento</text>
<text x="40" y="56" font-size="28" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Tração cutânea: esparadrapo nas laterais, barra no pé, peso de 2–4 kg</text>
