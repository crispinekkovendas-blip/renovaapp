<text x="640" y="627" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >ao terço proximal do</text>
<text x="640" y="654" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >antebraço, lado ulnar;</text>
<text x="640" y="681" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >MF 70–90°, IF em leve</text>
<text x="640" y="708" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >flexão, punho 20°</text>
