<text x="372" y="690" font-size="22" text-anchor="middle" font-weight="700" fill="#8a6d3b" >empurrar a falange</text>
<text x="372" y="718" font-size="22" text-anchor="middle" font-weight="700" fill="#8a6d3b" >proximal para cima</text>
<path d="M330 290 L330 340" fill="none" stroke="#8a6d3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="330" y="236" font-size="21" text-anchor="middle" font-weight="500" fill="#1c2a4a" >a outra mão fixa o metacarpo</text>
<text x="330" y="263" font-size="21" text-anchor="middle" font-weight="500" fill="#1c2a4a" >e empurra a cabeça para baixo</text>
<text x="70" y="580" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >bloqueio de hematoma ou do nervo ulnar;</text>
<text x="70" y="606" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >aceita até 30–40° no 5º MC; fica</text>
<text x="70" y="632" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >reduzido só com a tala bem moldada</text>
