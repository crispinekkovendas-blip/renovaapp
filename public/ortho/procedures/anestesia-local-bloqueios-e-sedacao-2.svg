<text x="700" y="180" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >agulha pelo dorso, na base da falange</text>
<text x="700" y="211" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >proximal, até quase a palma;</text>
<text x="700" y="242" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >1–2 mL de cada lado do osso</text>
<text x="700" y="273" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >(os nervos digitais são palmares)</text>
<path d="M692 370 L340 540" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="340" cy="540" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="700" y="380" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >repetir do outro lado do dedo</text>
<circle cx="700" cy="471" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="480" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >lidocaína 1–2% SEM vasoconstritor</text>
<circle cx="700" cy="513" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="522" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >esperar 5–10 min antes de testar</text>
<circle cx="700" cy="555" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="564" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >pouco volume: muito líquido garroteia</text>
<circle cx="700" cy="597" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="606" font-size="19" text-anchor="start" font-weight="500" fill="#1c2a4a" >polegar e hálux: igual, 4 pontos se preciso</text>
<text x="40" y="56" font-size="40" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Bloqueio digital: dois lados, pela base do dedo</text>
