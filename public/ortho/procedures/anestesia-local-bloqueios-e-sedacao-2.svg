<path d="M44 12 L114 12" fill="none" stroke="url(#hg12f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 36 L100 36" fill="none" stroke="url(#hg12f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
