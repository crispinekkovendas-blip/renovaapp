<text x="70" y="620" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >malha → algodão → 10–12 camadas</text>
<text x="70" y="651" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >→ moldar com a palma → atadura</text>
