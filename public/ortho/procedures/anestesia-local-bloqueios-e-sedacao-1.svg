<path d="M44 -12 L117.2 -0.9" fill="none" stroke="url(#hg9f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 12 L113.2 22.5" fill="none" stroke="url(#hg9f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 36 L99.4 44.4" fill="none" stroke="url(#hg9f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-34 -46 L4 -92" fill="none" stroke="url(#hg9f)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" /></g>
<defs><linearGradient id="cg10" gradientUnits="userSpaceOnUse" x1="360" y1="400.4" x2="360" y2="479.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.38" stop-color="#f8f5ef"/><stop offset="0.8" stop-color="#e3dccb" stop-opacity="0.85"/><stop offset="1" stop-color="#e3dccb"/></linearGradient></defs><path d="M160 479.6 Q208.4 479.6 237.4 462 L482.6 462 Q511.6 479.6 560 479.6 A39.6 39.6 0 0 0 560 400.4 Q511.6 400.4 482.6 418 L237.4 418 Q208.4 400.4 160 400.4 A39.6 39.6 0 0 0 160 479.6 Z" fill="url(#cg10)" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg11" gradientUnits="userSpaceOnUse" x1="365" y1="473" x2="365" y2="527"><stop offset="0" stop-color="#ffffff"/><stop offset="0.38" stop-color="#f8f5ef"/><stop offset="0.8" stop-color="#e3dccb" stop-opacity="0.85"/><stop offset="1" stop-color="#e3dccb"/></linearGradient></defs><path d="M170 527 Q203 527 222.8 515 L507.2 515 Q527 527 560 527 A27 27 0 0 0 560 473 Q527 473 507.2 485 L222.8 485 Q203 473 170 473 A27 27 0 0 0 170 527 Z" fill="url(#cg11)" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<g class="a blink" style="animation-duration:2s"><path d="M496.1 421.5 L511.9 427.7 L496.1 433.8 L511.9 440 L496.1 446.2 L511.9 452.3 L496.1 458.5" fill="none" stroke="#b3261e" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter" /></g>
