<text x="80" y="700" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >1. palpar o degrau no dorso (foco da fratura)</text>
<text x="80" y="731" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >2. assepsia; agulha 22–25G perpendicular, sentir entrar no foco</text>
<text x="80" y="762" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >3. aspirar sangue escuro = está no hematoma</text>
<text x="80" y="793" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >4. injetar lidocaína 1–2% sem vasoconstritor, 5–10 mL; esperar 5–10 min</text>
<path d="M812 140 L548 300" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="548" cy="300" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="820" y="150" font-size="26" text-anchor="start" font-weight="500" fill="#1c2a4a" >sangue do hematoma</text>
<text x="820" y="182" font-size="26" text-anchor="start" font-weight="500" fill="#1c2a4a" >na seringa confirma</text>
<text x="1150" y="600" font-size="24" text-anchor="end" font-weight="500" fill="#b3261e" >não usar se a pele sobre o foco</text>
<text x="1150" y="630" font-size="24" text-anchor="end" font-weight="500" fill="#b3261e" >estiver ferida (exposta) ou infectada</text>
<text x="40" y="56" font-size="38" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Bloqueio de hematoma: anestesiar dentro da fratura</text>
</svg>