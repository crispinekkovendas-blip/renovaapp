<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Infiltração subacromial</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<style>
/* Ciclo de 6 s para todos os movimentos; cada passo do procedimento ocupa uma fatia dele.
   Sem animação quando o leitor pede menos movimento e na impressão (o desenho parado é o procedimento completo). */
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.nudge{animation-name:nudge}
.draw{animation-name:draw}
.pulse{animation-name:pulse}
.blink{animation-name:blink}
.swing{animation-name:swing}
.push{animation-name:push}
.enter{animation-name:enter}
.enter2{animation-name:enter2}
.reduce{animation-name:reduce}
.flip{animation-name:flip}
.plunge{animation-name:plunge}
.drain{animation-name:drain}
.flow{animation-name:flow;animation-timing-function:linear}
.buzz{animation-name:buzz;animation-duration:.25s;animation-timing-function:linear}
.travel{animation-name:travel;animation-timing-function:linear}
.in1{animation-name:in1}.in2{animation-name:in2}.in3{animation-name:in3}
.out1{animation-name:out1}.out2{animation-name:out2}.out3{animation-name:out3}
.fade3{animation-name:fade3}
.squeeze{animation-name:squeeze}.pendulum{animation-name:pendulum}.tighten{animation-name:tighten}
.hi2{animation-name:hi2}.hi3{animation-name:hi3}.hi4{animation-name:hi4}
.focus2{animation-name:focus2}.focus3{animation-name:focus3}.focus4{animation-name:focus4}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes swing{0%,12%{transform:rotate(0)}55%,70%{transform:rotate(var(--a))}100%{transform:rotate(0)}}
@keyframes push{0%,12%{transform:translate(0,0)}55%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes enter{0%,8%{transform:translate(var(--dx),var(--dy))}38%,85%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes enter2{0%,8%{transform:translate(var(--dx),var(--dy))}30%,42%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45))}60%,88%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes reduce{0%,10%{transform:none}30%,40%{transform:translate(var(--dx),var(--dy))}55%,65%{transform:translate(var(--dx),var(--dy)) rotate(var(--a))}85%,100%{transform:none}}
@keyframes flip{0%,15%{transform:scaleY(1)}50%,70%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
@keyframes plunge{0%,45%{transform:translate(0,0)}80%,100%{transform:translate(var(--p),0)}}
@keyframes drain{0%,45%{transform:scaleX(1)}80%,100%{transform:scaleX(.2)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes buzz{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes travel{0%,8%{transform:translate(0,0)}92%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes in1{0%,18%{opacity:0}26%,100%{opacity:1}}
@keyframes in2{0%,42%{opacity:0}50%,100%{opacity:1}}
@keyframes in3{0%,66%{opacity:0}74%,100%{opacity:1}}
@keyframes out1{0%,22%{opacity:1}30%,100%{opacity:0}}
@keyframes out2{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes out3{0%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes pendulum{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes tighten{0%,15%{transform:scale(1,1)}55%,70%{transform:scale(.93,1)}100%{transform:scale(1,1)}}
@keyframes fade3{0%,66%{opacity:.75}80%,100%{opacity:.25}}
@keyframes hi2{0%{opacity:0}6%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes hi3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes hi4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes focus2{0%,44%{opacity:1}50%,94%{opacity:.35}100%{opacity:1}}
@keyframes focus3{0%,29%{opacity:1}33.3%,96%{opacity:.35}100%{opacity:1}}
@keyframes focus4{0%,22%{opacity:1}25%,97%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce),print{.a{animation:none!important}}
</style>
<path d="M260 250 Q400 180 560 240 L600 300 Q540 330 520 420 L480 600 Q400 640 330 560 L250 420 Z" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M560 240 Q640 230 680 270 L690 300 L600 300 Z" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<text x="610" y="285" font-size="22" text-anchor="middle" font-weight="500" fill="#1c2a4a" >acrômio</text>
<path d="M640 320 L700 700" fill="none" stroke="#1c2a4a" stroke-width="160" stroke-linecap="round" stroke-linejoin="round" />
<path d="M640 320 L700 700" fill="none" stroke="#f3e4d3" stroke-width="150" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg25" gradientUnits="userSpaceOnUse" x1="744.1" y1="498.3" x2="595.9" y2="521.7"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M640 320 L700 700" fill="none" stroke="url(#cg25)" stroke-width="150" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="650" cy="330" r="70" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" />
<g transform="translate(620 360)"><g class="a pulse" style="animation-duration:2s"><g transform="translate(-620 -360)"><circle cx="620" cy="360" r="14" fill="none" stroke="#8a6d3b" stroke-width="4" /></g></g></g>
<path d="M597.6 360 L642.4 360" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M620 337.6 L620 382.4" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<g class="a enter" style="--dx:37.6px;--dy:-13.7px"><g transform="translate(620 360) rotate(160) scale(1)"><path d="M0 0 L-110 0" fill="none" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M0 0 L-110 0" fill="none" stroke="#1c2a4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<rect x="-124" y="-10" width="14" height="20" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-274" y="-22" width="150" height="44" rx="4" fill="#ffffff" stroke="#1c2a4a" stroke-width="3" />
<g transform="translate(-185.5 0)"><g class="a drain"><g transform="translate(185.5 0)"><rect x="-268" y="-16" width="82.5" height="32" rx="0" fill="#c9a66b" stroke="none" stroke-width="5" /></g></g></g>
<g class="a plunge" style="--p:66px"><rect x="-310" y="-8" width="36" height="16" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-318" y="-26" width="10" height="52" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-280" y="-34" width="8" height="68" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" /></g></g></g>
<g class="a nudge" style="--dx:-10.8px;--dy:-9px;animation-duration:1.6s"><path d="M600 350 L540 300" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahr)"/></g>
<path d="M752 190 L620 360" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="620" cy="360" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="760" y="200" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >ângulo posterolateral do acrômio:</text>
<text x="760" y="231" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >2 cm abaixo e 1 cm medial</text>
<text x="760" y="320" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >agulha para a frente, levemente</text>
<text x="760" y="351" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >para cima e medial, na direção</text>
<text x="760" y="382" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >do processo coracoide</text>
<circle cx="760" cy="471" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="480" font-size="17" text-anchor="start" font-weight="500" fill="#1c2a4a" >5–8 mL (triancinolona 40 mg + lidocaína)</text>
<circle cx="760" cy="509" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="518" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >entrou fácil = espaço certo (bursa)</text>
<circle cx="760" cy="547" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="556" font-size="17" text-anchor="start" font-weight="500" fill="#1c2a4a" >resistência = tendão: recuar e reangular</text>
<circle cx="760" cy="585" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="594" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >no máximo 3 por ano</text>
<text x="40" y="56" font-size="25" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Subacromial, via posterior: abaixo do ângulo do acrômio, mirando o coracoide</text>
</svg>