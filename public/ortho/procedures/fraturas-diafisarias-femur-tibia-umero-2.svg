<text x="700" y="200" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >a tala sobe por dentro (axila)</text>
<text x="700" y="230" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >e por fora até sobre o acrômio</text>
<text x="700" y="300" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >12–15 camadas, 10–15 cm de largura;</text>
<text x="700" y="330" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >moldar o U no cotovelo</text>
<circle cx="700" cy="591" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="600" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >tipoia segura o antebraço (gravidade alinha)</text>
<circle cx="700" cy="627" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="636" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >sem apoiar o braço: o peso faz a tração</text>
<circle cx="700" cy="663" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="672" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >raio-X com a tala; nervo radial antes e depois</text>
<circle cx="700" cy="699" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="722" y="708" font-size="15" text-anchor="start" font-weight="500" fill="#1c2a4a" >trocar por brace funcional (Sarmiento) em 1–2 semanas</text>
<text x="40" y="56" font-size="26" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Pinça de confeiteiro: tala em U da axila ao ombro, cotovelo a 90°, tipoia</text>
</svg>