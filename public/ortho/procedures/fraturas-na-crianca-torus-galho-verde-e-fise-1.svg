<text x="660" y="200" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >cotovelo a 90°, antebraço neutro</text>
<text x="660" y="229" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >(polegar para cima); até a prega</text>
<text x="660" y="258" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >palmar: MF livres</text>
<circle cx="660" cy="371" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="682" y="380" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >acolchoar bem; moldar com a palma</text>
<circle cx="660" cy="409" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="682" y="418" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >edema esperado hoje? fender ou bivalvar</text>
<circle cx="660" cy="447" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="682" y="456" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >tipoia; braço elevado 48 h</text>
<circle cx="660" cy="485" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="682" y="494" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >raio-X em 7 dias (tórus: não precisa)</text>
<circle cx="660" cy="523" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="682" y="532" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >retirar em 3–4 semanas (menor que o adulto)</text>
<text x="660" y="620" font-size="24" text-anchor="start" font-weight="500" fill="#6b7280" >pais: dedos roxos, frios ou dor que não</text>
<text x="660" y="652" font-size="25" text-anchor="start" font-weight="500" fill="#6b7280" >passa com analgésico = voltar na hora</text>
<text x="40" y="56" font-size="26" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Criança: gesso axilopalmar, cotovelo a 90°, antebraço neutro, dedos livres</text>
