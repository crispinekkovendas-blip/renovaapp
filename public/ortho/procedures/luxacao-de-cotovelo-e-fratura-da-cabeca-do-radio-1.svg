<text x="650" y="540" font-size="20" text-anchor="middle" font-weight="500" fill="#b3261e" >olécrano saltado</text>
<text x="650" y="566" font-size="20" text-anchor="middle" font-weight="500" fill="#b3261e" >para trás</text>
<g class="a nudge" style="--dx:0px;--dy:12.5px;animation-duration:1.6s"><path d="M480 300 L480 350" fill="none" stroke="#8a6d3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<g class="a nudge" style="--dx:0px;--dy:-12.5px;animation-duration:1.6s"><path d="M480 540 L480 490" fill="none" stroke="#8a6d3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="480" y="270" font-size="22" text-anchor="middle" font-weight="700" fill="#1c2a4a" >ajudante fixa o úmero</text>
<g class="a nudge" style="--dx:13.4px;--dy:-3.9px;animation-duration:1.6s"><path d="M960 300 L1080 265" fill="none" stroke="#8a6d3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="1000" y="215" font-size="21" text-anchor="middle" font-weight="500" fill="#1c2a4a" >tração no eixo do antebraço,</text>
<text x="1000" y="242" font-size="21" text-anchor="middle" font-weight="500" fill="#1c2a4a" >cotovelo em leve flexão</text>
<g class="a nudge" style="--dx:-6.3px;--dy:-12.5px;animation-duration:1.6s"><path d="M690 560 L660 500" fill="none" stroke="#8a6d3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="760" y="620" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >seu polegar empurra o</text>
<text x="760" y="647" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >olécrano para a frente</text>
<text x="80" y="700" font-size="18" text-anchor="start" font-weight="500" fill="#6b7280" >sedação; antes e depois: pulso radial, nervos mediano e ulnar; depois: fletir e estender para ver se é estável;</text>
<text x="80" y="732" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >raio-X; tala posterior a 90° por 7–10 dias e movimento cedo</text>
<text x="40" y="56" font-size="23" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Luxação do cotovelo: ajudante fixa o braço, tração no antebraço, polegar no olécrano</text>
</svg>