<text x="320" y="620" font-size="21" text-anchor="middle" font-weight="500" fill="#1c2a4a" >segure o punho e gire o antebraço</text>
<text x="320" y="647" font-size="21" text-anchor="middle" font-weight="500" fill="#1c2a4a" >para dentro (palma para baixo), firme</text>
<text x="320" y="674" font-size="21" text-anchor="middle" font-weight="500" fill="#1c2a4a" >e rápido, até o fim; sente o clique</text>
