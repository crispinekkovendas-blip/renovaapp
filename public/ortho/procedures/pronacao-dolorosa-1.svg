<text x="820" y="200" font-size="22" text-anchor="start" font-weight="700" fill="#8a6d3b" >2. fletir até o ombro</text>
<text x="640" y="620" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >se a primeira não deu: supinar a palma</text>
<text x="640" y="646" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >para cima e dobrar o cotovelo todo.</text>
<text x="640" y="672" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >A criança usa o braço em 5–15 min;</text>
<text x="640" y="698" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >não usou: raio-X</text>
<text x="40" y="56" font-size="29" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Pronação dolorosa: hiperpronação (1ª escolha) ou supinação-flexão</text>
