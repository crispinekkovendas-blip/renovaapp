<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Bloqueio da fáscia ilíaca</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<style>
/* Ciclo de 6 s para todos os movimentos; cada passo do procedimento ocupa uma fatia dele.
   Sem animação quando o leitor pede menos movimento e na impressão (o desenho parado é o procedimento completo). */
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.nudge{animation-name:nudge}
.draw{animation-name:draw}
.pulse{animation-name:pulse}
.blink{animation-name:blink}
.swing{animation-name:swing}
.push{animation-name:push}
.enter{animation-name:enter}
.enter2{animation-name:enter2}
.reduce{animation-name:reduce}
.flip{animation-name:flip}
.plunge{animation-name:plunge}
.drain{animation-name:drain}
.flow{animation-name:flow;animation-timing-function:linear}
.buzz{animation-name:buzz;animation-duration:.25s;animation-timing-function:linear}
.travel{animation-name:travel;animation-timing-function:linear}
.in1{animation-name:in1}.in2{animation-name:in2}.in3{animation-name:in3}
.out1{animation-name:out1}.out2{animation-name:out2}.out3{animation-name:out3}
.fade3{animation-name:fade3}
.squeeze{animation-name:squeeze}.pendulum{animation-name:pendulum}.tighten{animation-name:tighten}
.hi2{animation-name:hi2}.hi3{animation-name:hi3}.hi4{animation-name:hi4}
.focus2{animation-name:focus2}.focus3{animation-name:focus3}.focus4{animation-name:focus4}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes swing{0%,12%{transform:rotate(0)}55%,70%{transform:rotate(var(--a))}100%{transform:rotate(0)}}
@keyframes push{0%,12%{transform:translate(0,0)}55%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes enter{0%,8%{transform:translate(var(--dx),var(--dy))}38%,85%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes enter2{0%,8%{transform:translate(var(--dx),var(--dy))}30%,42%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45))}60%,88%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes reduce{0%,10%{transform:none}30%,40%{transform:translate(var(--dx),var(--dy))}55%,65%{transform:translate(var(--dx),var(--dy)) rotate(var(--a))}85%,100%{transform:none}}
@keyframes flip{0%,15%{transform:scaleY(1)}50%,70%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
@keyframes plunge{0%,45%{transform:translate(0,0)}80%,100%{transform:translate(var(--p),0)}}
@keyframes drain{0%,45%{transform:scaleX(1)}80%,100%{transform:scaleX(.2)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes buzz{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes travel{0%,8%{transform:translate(0,0)}92%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes in1{0%,18%{opacity:0}26%,100%{opacity:1}}
@keyframes in2{0%,42%{opacity:0}50%,100%{opacity:1}}
@keyframes in3{0%,66%{opacity:0}74%,100%{opacity:1}}
@keyframes out1{0%,22%{opacity:1}30%,100%{opacity:0}}
@keyframes out2{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes out3{0%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes pendulum{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes tighten{0%,15%{transform:scale(1,1)}55%,70%{transform:scale(.93,1)}100%{transform:scale(1,1)}}
@keyframes fade3{0%,66%{opacity:.75}80%,100%{opacity:.25}}
@keyframes hi2{0%{opacity:0}6%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes hi3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes hi4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes focus2{0%,44%{opacity:1}50%,94%{opacity:.35}100%{opacity:1}}
@keyframes focus3{0%,29%{opacity:1}33.3%,96%{opacity:.35}100%{opacity:1}}
@keyframes focus4{0%,22%{opacity:1}25%,97%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce),print{.a{animation:none!important}}
</style>
<rect x="40" y="90" width="620" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="62" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >Onde furar</text>
<path d="M120 240 Q180 160 300 200 Q360 230 420 200 Q540 160 600 240 Q560 330 480 360 Q420 420 360 520 Q300 420 240 360 Q160 330 120 240 Z" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="150" cy="250" r="11" fill="#1c2a4a" stroke="#ffffff" stroke-width="3" />
<circle cx="360" cy="440" r="11" fill="#1c2a4a" stroke="#ffffff" stroke-width="3" />
<text x="90" y="230" font-size="26" text-anchor="start" font-weight="700" fill="#1c2a4a" >EIAS</text>
<text x="380" y="470" font-size="26" text-anchor="start" font-weight="700" fill="#1c2a4a" >tubérculo púbico</text>
<g class="a flow" style="animation-duration:2s"><path d="M150 250 L360 440" fill="none" stroke="#8a6d3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" /></g>
<circle cx="220" cy="313" r="8" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<circle cx="290" cy="377" r="8" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="205" y="300" font-size="24" text-anchor="end" font-weight="500" fill="#8a6d3b" >⅓</text>
<text x="240" y="345" font-size="24" text-anchor="start" font-weight="500" fill="#8a6d3b" >⅓</text>
<g transform="translate(232 346)"><g class="a pulse" style="animation-duration:2s"><g transform="translate(-232 -346)"><circle cx="232" cy="346" r="16" fill="none" stroke="#8a6d3b" stroke-width="4" /></g></g></g>
<path d="M206.4 346 L257.6 346" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M232 320.4 L232 371.6" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<g class="a nudge" style="--dx:0px;--dy:4px;animation-duration:1.6s"><path d="M232 346 L232 362" fill="none" stroke="#8a6d3b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<path d="M72 590 L232 346" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="232" cy="346" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="80" y="600" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >1 cm abaixo da junção do terço lateral</text>
<text x="80" y="631" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >com o terço médio da linha EIAS → púbis</text>
<text x="80" y="690" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >longe da artéria femoral (terço medial)</text>
<rect x="690" y="90" width="470" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="712" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >Em corte: dois pops</text>
<rect x="720" y="330" width="410" height="60" rx="0" fill="#f3e4d3" stroke="#1c2a4a" stroke-width="3" />
<rect x="720" y="390" width="410" height="50" rx="0" fill="#f7e9c9" stroke="#1c2a4a" stroke-width="3" />
<path d="M720 440 L1130 440" fill="none" stroke="#1c2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="720" y="440" width="410" height="60" rx="0" fill="#e4b0a0" stroke="#1c2a4a" stroke-width="3" />
<path d="M720 500 L1130 500" fill="none" stroke="#1c2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="720" y="500" width="410" height="120" rx="0" fill="#d9a090" stroke="#1c2a4a" stroke-width="3" />
<text x="735" y="368" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >pele e subcutâneo</text>
<text x="735" y="423" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >tecido gorduroso</text>
<text x="735" y="478" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >sartório / TFL</text>
<text x="735" y="560" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >iliopsoas — o anestésico</text>
<text x="735" y="588" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >se espalha por cima dele</text>
<text x="1120" y="432" font-size="22" text-anchor="end" font-weight="700" fill="#8a6d3b" >fáscia lata · pop 1</text>
<text x="1120" y="492" font-size="22" text-anchor="end" font-weight="700" fill="#8a6d3b" >fáscia ilíaca · pop 2</text>
<g class="a enter2" style="--dx:0px;--dy:-60px"><g transform="translate(930 505) rotate(90) scale(1)"><path d="M0 0 L-200 0" fill="none" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M0 0 L-200 0" fill="none" stroke="#1c2a4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<rect x="-214" y="-10" width="14" height="20" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-324" y="-22" width="110" height="44" rx="4" fill="#ffffff" stroke="#1c2a4a" stroke-width="3" />
<g transform="translate(-257.5 0)"><g class="a drain"><g transform="translate(257.5 0)"><rect x="-318" y="-16" width="60.5" height="32" rx="0" fill="#c9a66b" stroke="none" stroke-width="5" /></g></g></g>
<g class="a plunge" style="--p:48.4px"><rect x="-360" y="-8" width="36" height="16" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-368" y="-26" width="10" height="52" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-330" y="-34" width="8" height="68" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" /></g></g></g>
<g class="a in3"><path d="M870 505 Q930 540 990 505" fill="#c9a66b" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /></g>
<text x="720" y="668" font-size="23" text-anchor="start" font-weight="500" fill="#6b7280" >agulha romba, perpendicular;</text>
<text x="720" y="697" font-size="23" text-anchor="start" font-weight="500" fill="#6b7280" >30–40 mL (ropivacaína 0,375% ou</text>
<text x="720" y="726" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >lidocaína 1%, dose por kg); 15–20 min</text>
<text x="40" y="56" font-size="39" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Bloqueio da fáscia ilíaca: ponto e os dois "pops"</text>
</svg>