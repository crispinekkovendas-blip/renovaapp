<path d="M72 590 L232 346" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="232" cy="346" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="80" y="600" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >1 cm abaixo da junção do terço lateral</text>
<text x="80" y="631" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >com o terço médio da linha EIAS → púbis</text>
<text x="80" y="690" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >longe da artéria femoral (terço medial)</text>
<rect x="690" y="90" width="470" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="712" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >Em corte: dois pops</text>
<rect x="720" y="330" width="410" height="60" rx="0" fill="#f3e4d3" stroke="#1c2a4a" stroke-width="3" />
<rect x="720" y="390" width="410" height="50" rx="0" fill="#f7e9c9" stroke="#1c2a4a" stroke-width="3" />
<path d="M720 440 L1130 440" fill="none" stroke="#1c2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="720" y="440" width="410" height="60" rx="0" fill="#e4b0a0" stroke="#1c2a4a" stroke-width="3" />
<path d="M720 500 L1130 500" fill="none" stroke="#1c2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="720" y="500" width="410" height="120" rx="0" fill="#d9a090" stroke="#1c2a4a" stroke-width="3" />
<text x="735" y="368" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >pele e subcutâneo</text>
<text x="735" y="423" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >tecido gorduroso</text>
<text x="735" y="478" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >sartório / TFL</text>
<text x="735" y="560" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >iliopsoas — o anestésico</text>
<text x="735" y="588" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >se espalha por cima dele</text>
<text x="1120" y="432" font-size="22" text-anchor="end" font-weight="700" fill="#8a6d3b" >fáscia lata · pop 1</text>
<text x="1120" y="492" font-size="22" text-anchor="end" font-weight="700" fill="#8a6d3b" >fáscia ilíaca · pop 2</text>
