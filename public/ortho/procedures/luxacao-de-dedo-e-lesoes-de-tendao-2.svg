<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Tala do dedo em martelo</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<style>
/* Ciclo de 6 s para todos os movimentos; cada passo do procedimento ocupa uma fatia dele.
   Sem animação quando o leitor pede menos movimento e na impressão (o desenho parado é o procedimento completo). */
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.nudge{animation-name:nudge}
.draw{animation-name:draw}
.pulse{animation-name:pulse}
.blink{animation-name:blink}
.swing{animation-name:swing}
.push{animation-name:push}
.enter{animation-name:enter}
.enter2{animation-name:enter2}
.reduce{animation-name:reduce}
.flip{animation-name:flip}
.plunge{animation-name:plunge}
.drain{animation-name:drain}
.flow{animation-name:flow;animation-timing-function:linear}
.buzz{animation-name:buzz;animation-duration:.25s;animation-timing-function:linear}
.travel{animation-name:travel;animation-timing-function:linear}
.in1{animation-name:in1}.in2{animation-name:in2}.in3{animation-name:in3}
.out1{animation-name:out1}.out2{animation-name:out2}.out3{animation-name:out3}
.fade3{animation-name:fade3}
.squeeze{animation-name:squeeze}.pendulum{animation-name:pendulum}.tighten{animation-name:tighten}
.hi2{animation-name:hi2}.hi3{animation-name:hi3}.hi4{animation-name:hi4}
.focus2{animation-name:focus2}.focus3{animation-name:focus3}.focus4{animation-name:focus4}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes swing{0%,12%{transform:rotate(0)}55%,70%{transform:rotate(var(--a))}100%{transform:rotate(0)}}
@keyframes push{0%,12%{transform:translate(0,0)}55%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes enter{0%,8%{transform:translate(var(--dx),var(--dy))}38%,85%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes enter2{0%,8%{transform:translate(var(--dx),var(--dy))}30%,42%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45))}60%,88%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes reduce{0%,10%{transform:none}30%,40%{transform:translate(var(--dx),var(--dy))}55%,65%{transform:translate(var(--dx),var(--dy)) rotate(var(--a))}85%,100%{transform:none}}
@keyframes flip{0%,15%{transform:scaleY(1)}50%,70%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
@keyframes plunge{0%,45%{transform:translate(0,0)}80%,100%{transform:translate(var(--p),0)}}
@keyframes drain{0%,45%{transform:scaleX(1)}80%,100%{transform:scaleX(.2)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes buzz{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes travel{0%,8%{transform:translate(0,0)}92%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes in1{0%,18%{opacity:0}26%,100%{opacity:1}}
@keyframes in2{0%,42%{opacity:0}50%,100%{opacity:1}}
@keyframes in3{0%,66%{opacity:0}74%,100%{opacity:1}}
@keyframes out1{0%,22%{opacity:1}30%,100%{opacity:0}}
@keyframes out2{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes out3{0%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes pendulum{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes tighten{0%,15%{transform:scale(1,1)}55%,70%{transform:scale(.93,1)}100%{transform:scale(1,1)}}
@keyframes fade3{0%,66%{opacity:.75}80%,100%{opacity:.25}}
@keyframes hi2{0%{opacity:0}6%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes hi3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes hi4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes focus2{0%,44%{opacity:1}50%,94%{opacity:.35}100%{opacity:1}}
@keyframes focus3{0%,29%{opacity:1}33.3%,96%{opacity:.35}100%{opacity:1}}
@keyframes focus4{0%,22%{opacity:1}25%,97%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce),print{.a{animation:none!important}}
</style>
<rect x="40" y="90" width="540" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="62" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >A lesão</text>
<path d="M90 420 L330 420 L500 420" fill="none" stroke="#1c2a4a" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" />
<g transform="translate(500 420)"><g class="a swing" style="--a:-36deg"><g transform="translate(-500 -420)"><path d="M500 420 L600 500" fill="none" stroke="#1c2a4a" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" /></g></g></g>
<path d="M90 420 L330 420 L500 420" fill="none" stroke="#f3e4d3" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg133" gradientUnits="userSpaceOnUse" x1="210" y1="387" x2="210" y2="453"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M90 420 L330 420" fill="none" stroke="url(#cg133)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg134" gradientUnits="userSpaceOnUse" x1="415" y1="387" x2="415" y2="453"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M330 420 L500 420" fill="none" stroke="url(#cg134)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" />
<g transform="translate(500 420)"><g class="a swing" style="--a:-36deg"><g transform="translate(-500 -420)"><path d="M500 420 L600 500" fill="none" stroke="#f3e4d3" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg135" gradientUnits="userSpaceOnUse" x1="567.5" y1="438.1" x2="532.5" y2="481.9"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M500 420 L600 500" fill="none" stroke="url(#cg135)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" /></g></g></g>
<g class="a nudge" style="--dx:0px;--dy:14px;animation-duration:1.6s"><path d="M560 300 L560 380" fill="none" stroke="#b3261e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahr)"/></g>
<text x="330" y="250" font-size="22" text-anchor="start" font-weight="500" fill="#b3261e" >ponta cai: não estende</text>
<text x="330" y="278" font-size="22" text-anchor="start" font-weight="500" fill="#b3261e" >ativamente a IFD</text>
<text x="70" y="620" font-size="21" text-anchor="start" font-weight="500" fill="#6b7280" >raio-X: avulsão óssea &gt; ⅓ da articulação</text>
<text x="70" y="647" font-size="21" text-anchor="start" font-weight="500" fill="#6b7280" >ou subluxação → cirurgião da mão</text>
<rect x="600" y="90" width="560" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="622" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >A tala</text>
<path d="M650 420 L890 420 L1060 420" fill="none" stroke="#1c2a4a" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" />
<path d="M1060 420 L1130 412" fill="none" stroke="#1c2a4a" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" />
<path d="M650 420 L890 420 L1060 420" fill="none" stroke="#f3e4d3" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg136" gradientUnits="userSpaceOnUse" x1="770" y1="387" x2="770" y2="453"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M650 420 L890 420" fill="none" stroke="url(#cg136)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg137" gradientUnits="userSpaceOnUse" x1="975" y1="387" x2="975" y2="453"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M890 420 L1060 420" fill="none" stroke="url(#cg137)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" />
<path d="M1060 420 L1130 412" fill="none" stroke="#f3e4d3" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg138" gradientUnits="userSpaceOnUse" x1="1091.8" y1="388.2" x2="1098.2" y2="443.8"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M1060 420 L1130 412" fill="none" stroke="url(#cg138)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
<g class="a in1"><path d="M990 360 L1150 352 L1150 386 L990 394 Z" fill="#ece7dc" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M990 360 L1150 352 L1150 386 L990 394 Z" fill="url(#hatch)" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g>
<g class="a in2"><rect x="1000" y="350" width="150" height="24" rx="4" fill="#b9c3d4" stroke="#1c2a4a" stroke-width="3" />
<rect x="1000" y="452" width="150" height="24" rx="4" fill="#b9c3d4" stroke="#1c2a4a" stroke-width="3" /></g>
<g class="a nudge" style="--dx:0px;--dy:12.5px;animation-duration:1.6s"><path d="M900 330 L900 380" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="900" y="310" font-size="22" text-anchor="middle" font-weight="700" fill="#8a6d3b" >IFP livre</text>
<text x="630" y="600" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >tala dorsal (alumínio, Stack ou termoplástica)</text>
<text x="630" y="627" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >só na IFD; nunca deixar a ponta dobrar —</text>
<text x="630" y="654" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >nem para lavar (trocar com o dedo apoiado</text>
<text x="630" y="681" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >na mesa); 6–8 semanas, depois mais 2–4</text>
<text x="630" y="708" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >só à noite</text>
<text x="40" y="56" font-size="23" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Dedo em martelo: tala com a IFD reta (ou leve hiperextensão), IFP livre, 6–8 semanas</text>
</svg>