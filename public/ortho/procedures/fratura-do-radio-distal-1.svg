<text x="830" y="590" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >antebraquiopalmar (ou sugar-tong)</text>
<text x="830" y="614" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >com punho em leve flexão e</text>
<text x="830" y="638" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >desvio ulnar, 3 pontos de</text>
<text x="830" y="662" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >moldagem; raio-X de controle;</text>
<text x="830" y="686" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >rever em 7 dias (perde a redução?)</text>
<text x="40" y="56" font-size="27" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Colles: tração, desfazer o dorso de garfo, flexão + desvio ulnar, tala</text>
