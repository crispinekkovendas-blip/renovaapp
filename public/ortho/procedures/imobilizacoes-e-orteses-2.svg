<path d="M800 280 L1100 280" fill="none" stroke="#f3e4d3" stroke-width="100" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg7" gradientUnits="userSpaceOnUse" x1="950" y1="230" x2="950" y2="330"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M800 280 L1100 280" fill="none" stroke="url(#cg7)" stroke-width="100" stroke-linecap="round" stroke-linejoin="round" />
<path d="M810 225 L1100 225 L1100 335 L810 335 Z" fill="#ece7dc" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M810 225 L1100 225 L1100 335 L810 335 Z" fill="url(#hatch)" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<g class="a flow" style="animation-duration:1.5s"><path d="M800 280 L1110 280" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" />
<path d="M800 225 L800 335" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" /></g>
<text x="790" y="400" font-size="24" text-anchor="start" font-weight="500" fill="#6b7280" >cortar dos dois lados e abrir</text>
<text x="790" y="430" font-size="24" text-anchor="start" font-weight="500" fill="#6b7280" >o algodão até a pele</text>
<text x="40" y="56" font-size="32" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Gesso circular: três pontos de moldagem, articulações livres</text>
</svg>