<path d="M44 -36 L103.2 -17.7" fill="none" stroke="url(#hg6f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 -12 L114.7 9.9" fill="none" stroke="url(#hg6f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 12 L110.9 32.7" fill="none" stroke="url(#hg6f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 36 L97.5 52.5" fill="none" stroke="url(#hg6f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-34 -46 L4 -92" fill="none" stroke="url(#hg6f)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" /></g>
<path d="M160 330 L560 330 Q600 330 610 360 L610 440 Q600 470 560 470 L160 470 Z" fill="#ece7dc" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M160 330 L560 330 Q600 330 610 360 L610 440 Q600 470 560 470 L160 470 Z" fill="url(#hatch)" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<g class="a nudge" style="--dx:0px;--dy:14px;animation-duration:1.6s"><path d="M360 250 L360 318" fill="none" stroke="#8a6d3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<g class="a nudge" style="--dx:0px;--dy:-14px;animation-duration:1.6s"><path d="M200 540 L200 482" fill="none" stroke="#8a6d3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<g class="a nudge" style="--dx:0px;--dy:-14px;animation-duration:1.6s"><path d="M520 540 L520 482" fill="none" stroke="#8a6d3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="360" y="232" font-size="26" text-anchor="middle" font-weight="700" fill="#8a6d3b" >moldagem em três pontos</text>
<text x="80" y="640" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >a palma molda — nunca a ponta dos dedos</text>
<text x="80" y="671" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >(ponto de pressão = úlcera)</text>
<path d="M632 550 L628 445" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="628" cy="445" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="640" y="560" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >livres: MF (prega palmar) e cotovelo</text>
<text x="640" y="591" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >checar pulso, cor e sensibilidade</text>
<text x="640" y="622" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >antes de liberar</text>
<rect x="760" y="100" width="400" height="330" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="782" y="144" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >Feito no dia? Bivalvar</text>
