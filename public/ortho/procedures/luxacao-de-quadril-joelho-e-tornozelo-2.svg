<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Redução da fratura-luxação do tornozelo</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<rect x="60" y="330" width="480" height="30" rx="8" fill="#b9c3d4" stroke="#1c2a4a" stroke-width="4" />
<path d="M90 360 L90 450" fill="none" stroke="#1c2a4a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M510 360 L510 450" fill="none" stroke="#1c2a4a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M120 320 L420 320" fill="none" stroke="#1c2a4a" stroke-width="150" stroke-linecap="round" stroke-linejoin="round" />
<path d="M420 320 L430 560" fill="none" stroke="#1c2a4a" stroke-width="125" stroke-linecap="round" stroke-linejoin="round" />
<path d="M120 320 L420 320" fill="none" stroke="#f3e4d3" stroke-width="140" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg59" gradientUnits="userSpaceOnUse" x1="270" y1="250" x2="270" y2="390"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M120 320 L420 320" fill="none" stroke="url(#cg59)" stroke-width="140" stroke-linecap="round" stroke-linejoin="round" />
<path d="M420 320 L430 560" fill="none" stroke="#f3e4d3" stroke-width="115" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg60" gradientUnits="userSpaceOnUse" x1="482.5" y1="437.6" x2="367.5" y2="442.4"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M420 320 L430 560" fill="none" stroke="url(#cg60)" stroke-width="115" stroke-linecap="round" stroke-linejoin="round" />
<g transform="translate(430 600) rotate(0) scale(1.1)"><defs><linearGradient id="fg61" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.45" stop-color="#f3e4d3"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs><path d="M-30 -50 L-36 0 Q-30 30 10 36 L150 40 Q172 36 172 20 Q168 4 140 0 L60 -12 Q40 -30 36 -60 Z" fill="url(#fg61)" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g>
<path d="M82 210 L300 290" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="300" cy="290" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="90" y="220" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >coxa apoiada na maca, joelho a 90°:</text>
<text x="90" y="248" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >relaxa a panturrilha</text>
<path d="M560 420 L490 440" fill="none" stroke="#8a6d3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="575" y="428" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >uma mão fixa a tíbia</text>
<path d="M430 740 L430 690" fill="none" stroke="#8a6d3b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="470" y="735" font-size="22" text-anchor="start" font-weight="700" fill="#8a6d3b" >a outra traciona pelo calcanhar</text>
<path d="M640 560 Q700 620 640 680" fill="none" stroke="#b3261e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahr)"/>
<text x="715" y="610" font-size="22" text-anchor="start" font-weight="500" fill="#b3261e" >e desfaz o desvio: pé</text>
<text x="715" y="638" font-size="22" text-anchor="start" font-weight="500" fill="#b3261e" >para o lado oposto</text>
<text x="715" y="666" font-size="22" text-anchor="start" font-weight="500" fill="#b3261e" >ao que saiu</text>
<circle cx="740" cy="141" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="762" y="150" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >pulso ou pele brancas: reduzir AGORA,</text>
<text x="762" y="176" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >   antes do raio-X</text>
<circle cx="740" cy="214" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="762" y="223" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >sedação ou bloqueio de hematoma</text>
<circle cx="740" cy="258" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="762" y="267" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >sente encaixar; a pele alivia na hora</text>
<circle cx="740" cy="302" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="762" y="311" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >tala posterior + estribo a 90°</text>
<circle cx="740" cy="346" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="762" y="355" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >raio-X de controle com a tala; elevar</text>
<circle cx="740" cy="390" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="762" y="399" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >não reduz ou reluxa: centro cirúrgico</text>
<text x="40" y="56" font-size="23" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Fratura-luxação do tornozelo: joelho a 90°, tração no calcanhar, desfazer o desvio</text>
</svg>