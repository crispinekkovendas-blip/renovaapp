<text x="545" y="250" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >serra oscilante: só vibra,</text>
<text x="545" y="278" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >não corta a pele</text>
<path d="M320 320 L320 350" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M320 600 L320 560" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="320" y="640" font-size="24" text-anchor="middle" font-weight="700" fill="#8a6d3b" >abrir as duas metades</text>
<text x="70" y="700" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >cortar os dois lados (radial e ulnar)</text>
<text x="70" y="728" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >ao longo de todo o gesso</text>
<rect x="760" y="90" width="400" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="782" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >Em corte</text>
<circle cx="960" cy="400" r="150" fill="#ece7dc" stroke="#1c2a4a" stroke-width="5" />
<circle cx="960" cy="400" r="118" fill="#fbf8f2" stroke="#1c2a4a" stroke-width="3" />
<circle cx="960" cy="400" r="90" fill="#f3e4d3" stroke="#1c2a4a" stroke-width="5" />
<path d="M810 400 L870 400" fill="none" stroke="#b3261e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M1050 400 L1110 400" fill="none" stroke="#b3261e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M960 560 L960 500" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="960" y="600" font-size="22" text-anchor="middle" font-weight="700" fill="#8a6d3b" >cortar também o algodão</text>
<text x="960" y="628" font-size="22" text-anchor="middle" font-weight="700" fill="#8a6d3b" >e a malha, até a pele</text>
<text x="790" y="700" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >gesso só aberto de um lado</text>
<text x="790" y="732" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >não alivia pressão</text>
<text x="40" y="56" font-size="27" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Gesso apertado: bivalvar, abrir o algodão até a pele, elevar e reavaliar</text>
</svg>