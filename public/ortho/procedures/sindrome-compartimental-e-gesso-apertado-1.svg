<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Bivalvar o gesso</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<style>
/* Ciclo de 6 s para todos os movimentos; cada passo do procedimento ocupa uma fatia dele.
   Sem animação quando o leitor pede menos movimento e na impressão (o desenho parado é o procedimento completo). */
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.nudge{animation-name:nudge}
.draw{animation-name:draw}
.pulse{animation-name:pulse}
.blink{animation-name:blink}
.swing{animation-name:swing}
.push{animation-name:push}
.enter{animation-name:enter}
.enter2{animation-name:enter2}
.reduce{animation-name:reduce}
.flip{animation-name:flip}
.plunge{animation-name:plunge}
.drain{animation-name:drain}
.flow{animation-name:flow;animation-timing-function:linear}
.buzz{animation-name:buzz;animation-duration:.25s;animation-timing-function:linear}
.travel{animation-name:travel;animation-timing-function:linear}
.in1{animation-name:in1}.in2{animation-name:in2}.in3{animation-name:in3}
.out1{animation-name:out1}.out2{animation-name:out2}.out3{animation-name:out3}
.fade3{animation-name:fade3}
.squeeze{animation-name:squeeze}.pendulum{animation-name:pendulum}.tighten{animation-name:tighten}
.hi2{animation-name:hi2}.hi3{animation-name:hi3}.hi4{animation-name:hi4}
.focus2{animation-name:focus2}.focus3{animation-name:focus3}.focus4{animation-name:focus4}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes swing{0%,12%{transform:rotate(0)}55%,70%{transform:rotate(var(--a))}100%{transform:rotate(0)}}
@keyframes push{0%,12%{transform:translate(0,0)}55%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes enter{0%,8%{transform:translate(var(--dx),var(--dy))}38%,85%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes enter2{0%,8%{transform:translate(var(--dx),var(--dy))}30%,42%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45))}60%,88%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes reduce{0%,10%{transform:none}30%,40%{transform:translate(var(--dx),var(--dy))}55%,65%{transform:translate(var(--dx),var(--dy)) rotate(var(--a))}85%,100%{transform:none}}
@keyframes flip{0%,15%{transform:scaleY(1)}50%,70%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
@keyframes plunge{0%,45%{transform:translate(0,0)}80%,100%{transform:translate(var(--p),0)}}
@keyframes drain{0%,45%{transform:scaleX(1)}80%,100%{transform:scaleX(.2)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes buzz{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes travel{0%,8%{transform:translate(0,0)}92%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes in1{0%,18%{opacity:0}26%,100%{opacity:1}}
@keyframes in2{0%,42%{opacity:0}50%,100%{opacity:1}}
@keyframes in3{0%,66%{opacity:0}74%,100%{opacity:1}}
@keyframes out1{0%,22%{opacity:1}30%,100%{opacity:0}}
@keyframes out2{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes out3{0%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes pendulum{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes tighten{0%,15%{transform:scale(1,1)}55%,70%{transform:scale(.93,1)}100%{transform:scale(1,1)}}
@keyframes fade3{0%,66%{opacity:.75}80%,100%{opacity:.25}}
@keyframes hi2{0%{opacity:0}6%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes hi3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes hi4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes focus2{0%,44%{opacity:1}50%,94%{opacity:.35}100%{opacity:1}}
@keyframes focus3{0%,29%{opacity:1}33.3%,96%{opacity:.35}100%{opacity:1}}
@keyframes focus4{0%,22%{opacity:1}25%,97%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce),print{.a{animation:none!important}}
</style>
<rect x="40" y="90" width="700" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="62" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >Os dois cortes</text>
<path d="M110 420 L520 420" fill="none" stroke="#1c2a4a" stroke-width="130" stroke-linecap="round" stroke-linejoin="round" />
<path d="M110 420 L520 420" fill="none" stroke="#f3e4d3" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg34" gradientUnits="userSpaceOnUse" x1="315" y1="360" x2="315" y2="480"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M110 420 L520 420" fill="none" stroke="url(#cg34)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" />
<g transform="translate(620 420) rotate(0) scale(1.25)"><defs><linearGradient id="hg35f" gradientUnits="userSpaceOnUse" x1="0" y1="-9" x2="0" y2="9"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.4" stop-color="#f3e4d3"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient><linearGradient id="hg35p" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.45" stop-color="#f3e4d3"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M-34 -46 L4 -92" fill="none" stroke="#1c2a4a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-4 -50 L46 -46 Q60 0 46 46 L-4 50 Q-66 30 -68 0 Q-66 -30 -4 -50 Z" fill="url(#hg35p)" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 -36 L103.2 -17.7" fill="none" stroke="#1c2a4a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 -12 L114.7 9.9" fill="none" stroke="#1c2a4a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 12 L110.9 32.7" fill="none" stroke="#1c2a4a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 36 L97.5 52.5" fill="none" stroke="#1c2a4a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 -36 L103.2 -17.7" fill="none" stroke="url(#hg35f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 -12 L114.7 9.9" fill="none" stroke="url(#hg35f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 12 L110.9 32.7" fill="none" stroke="url(#hg35f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 36 L97.5 52.5" fill="none" stroke="url(#hg35f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-34 -46 L4 -92" fill="none" stroke="url(#hg35f)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" /></g>
<path d="M120 352 L520 352 Q560 352 570 380 L570 460 Q560 488 520 488 L120 488 Z" fill="#ece7dc" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M120 352 L520 352 Q560 352 570 380 L570 460 Q560 488 520 488 L120 488 Z" fill="url(#hatch)" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<g class="a flow" style="animation-duration:1.5s"><path d="M100 352 L580 352" fill="none" stroke="#b3261e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 10" />
<path d="M100 488 L580 488" fill="none" stroke="#b3261e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 10" /></g>
<g class="a travel" style="--dx:-250px;--dy:0px"><g transform="translate(420 330)"><g class="a buzz"><g transform="translate(-420 -330)"><g transform="translate(420 300)"><rect x="-10" y="-120" width="110" height="60" rx="10" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="3" />
<rect x="-16" y="-70" width="32" height="60" rx="0" fill="#b9c3d4" stroke="#1c2a4a" stroke-width="3" />
<circle cx="0" cy="30" r="34" fill="#ffffff" stroke="#1c2a4a" stroke-width="4" />
<circle cx="0" cy="30" r="34" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-dasharray="6 6"/></g></g></g></g></g>
<text x="545" y="250" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >serra oscilante: só vibra,</text>
<text x="545" y="278" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >não corta a pele</text>
<g class="a nudge" style="--dx:0px;--dy:7.5px;animation-duration:1.6s"><path d="M320 320 L320 350" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<g class="a nudge" style="--dx:0px;--dy:-10px;animation-duration:1.6s"><path d="M320 600 L320 560" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="320" y="640" font-size="24" text-anchor="middle" font-weight="700" fill="#8a6d3b" >abrir as duas metades</text>
<text x="70" y="700" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >cortar os dois lados (radial e ulnar)</text>
<text x="70" y="728" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >ao longo de todo o gesso</text>
<rect x="760" y="90" width="400" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="782" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >Em corte</text>
<circle cx="960" cy="400" r="150" fill="#ece7dc" stroke="#1c2a4a" stroke-width="5" />
<circle cx="960" cy="400" r="118" fill="#fbf8f2" stroke="#1c2a4a" stroke-width="3" />
<circle cx="960" cy="400" r="90" fill="#f3e4d3" stroke="#1c2a4a" stroke-width="5" />
<g class="a blink" style="animation-duration:1.5s"><path d="M810 400 L870 400" fill="none" stroke="#b3261e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M1050 400 L1110 400" fill="none" stroke="#b3261e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g>
<g class="a nudge" style="--dx:0px;--dy:-14px;animation-duration:1.6s"><path d="M960 560 L960 500" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="960" y="600" font-size="22" text-anchor="middle" font-weight="700" fill="#8a6d3b" >cortar também o algodão</text>
<text x="960" y="628" font-size="22" text-anchor="middle" font-weight="700" fill="#8a6d3b" >e a malha, até a pele</text>
<text x="790" y="700" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >gesso só aberto de um lado</text>
<text x="790" y="732" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >não alivia pressão</text>
<text x="40" y="56" font-size="27" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Gesso apertado: bivalvar, abrir o algodão até a pele, elevar e reavaliar</text>
</svg>