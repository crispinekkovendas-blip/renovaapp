<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Punção do joelho</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<style>
/* Ciclo de 6 s para todos os movimentos; cada passo do procedimento ocupa uma fatia dele.
   Sem animação quando o leitor pede menos movimento e na impressão (o desenho parado é o procedimento completo). */
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.nudge{animation-name:nudge}
.draw{animation-name:draw}
.pulse{animation-name:pulse}
.blink{animation-name:blink}
.swing{animation-name:swing}
.push{animation-name:push}
.enter{animation-name:enter}
.enter2{animation-name:enter2}
.reduce{animation-name:reduce}
.flip{animation-name:flip}
.plunge{animation-name:plunge}
.drain{animation-name:drain}
.flow{animation-name:flow;animation-timing-function:linear}
.buzz{animation-name:buzz;animation-duration:.25s;animation-timing-function:linear}
.travel{animation-name:travel;animation-timing-function:linear}
.in1{animation-name:in1}.in2{animation-name:in2}.in3{animation-name:in3}
.out1{animation-name:out1}.out2{animation-name:out2}.out3{animation-name:out3}
.fade3{animation-name:fade3}
.squeeze{animation-name:squeeze}.pendulum{animation-name:pendulum}.tighten{animation-name:tighten}
.hi2{animation-name:hi2}.hi3{animation-name:hi3}.hi4{animation-name:hi4}
.focus2{animation-name:focus2}.focus3{animation-name:focus3}.focus4{animation-name:focus4}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes swing{0%,12%{transform:rotate(0)}55%,70%{transform:rotate(var(--a))}100%{transform:rotate(0)}}
@keyframes push{0%,12%{transform:translate(0,0)}55%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes enter{0%,8%{transform:translate(var(--dx),var(--dy))}38%,85%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes enter2{0%,8%{transform:translate(var(--dx),var(--dy))}30%,42%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45))}60%,88%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes reduce{0%,10%{transform:none}30%,40%{transform:translate(var(--dx),var(--dy))}55%,65%{transform:translate(var(--dx),var(--dy)) rotate(var(--a))}85%,100%{transform:none}}
@keyframes flip{0%,15%{transform:scaleY(1)}50%,70%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
@keyframes plunge{0%,45%{transform:translate(0,0)}80%,100%{transform:translate(var(--p),0)}}
@keyframes drain{0%,45%{transform:scaleX(1)}80%,100%{transform:scaleX(.2)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes buzz{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes travel{0%,8%{transform:translate(0,0)}92%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes in1{0%,18%{opacity:0}26%,100%{opacity:1}}
@keyframes in2{0%,42%{opacity:0}50%,100%{opacity:1}}
@keyframes in3{0%,66%{opacity:0}74%,100%{opacity:1}}
@keyframes out1{0%,22%{opacity:1}30%,100%{opacity:0}}
@keyframes out2{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes out3{0%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes pendulum{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes tighten{0%,15%{transform:scale(1,1)}55%,70%{transform:scale(.93,1)}100%{transform:scale(1,1)}}
@keyframes fade3{0%,66%{opacity:.75}80%,100%{opacity:.25}}
@keyframes hi2{0%{opacity:0}6%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes hi3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes hi4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes focus2{0%,44%{opacity:1}50%,94%{opacity:.35}100%{opacity:1}}
@keyframes focus3{0%,29%{opacity:1}33.3%,96%{opacity:.35}100%{opacity:1}}
@keyframes focus4{0%,22%{opacity:1}25%,97%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce),print{.a{animation:none!important}}
</style>
<path d="M420 190 L420 320" fill="none" stroke="#1c2a4a" stroke-width="200" stroke-linecap="round" stroke-linejoin="round" />
<path d="M420 190 L420 320" fill="none" stroke="#f3e4d3" stroke-width="190" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg23" gradientUnits="userSpaceOnUse" x1="515" y1="255" x2="325" y2="255"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M420 190 L420 320" fill="none" stroke="url(#cg23)" stroke-width="190" stroke-linecap="round" stroke-linejoin="round" />
<path d="M420 480 L420 700" fill="none" stroke="#1c2a4a" stroke-width="170" stroke-linecap="round" stroke-linejoin="round" />
<path d="M420 480 L420 700" fill="none" stroke="#f3e4d3" stroke-width="160" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg24" gradientUnits="userSpaceOnUse" x1="500" y1="590" x2="340" y2="590"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M420 480 L420 700" fill="none" stroke="url(#cg24)" stroke-width="160" stroke-linecap="round" stroke-linejoin="round" />
<path d="M330 330 Q420 300 510 330 Q530 420 420 470 Q310 420 330 330 Z" fill="#e6cdb5" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M370 320 Q420 290 470 320 Q488 380 420 420 Q352 380 370 320 Z" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<text x="420" y="372" font-size="22" text-anchor="middle" font-weight="500" fill="#1c2a4a" >patela</text>
<g transform="translate(515 300)"><g class="a pulse" style="animation-duration:2s"><g transform="translate(-515 -300)"><circle cx="515" cy="300" r="14" fill="none" stroke="#8a6d3b" stroke-width="4" /></g></g></g>
<path d="M492.6 300 L537.4 300" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M515 277.6 L515 322.4" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<g class="a enter" style="--dx:36.3px;--dy:16.9px"><g transform="translate(515 300) rotate(205) scale(1)"><path d="M0 0 L-100 0" fill="none" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M0 0 L-100 0" fill="none" stroke="#1c2a4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<rect x="-114" y="-10" width="14" height="20" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-264" y="-22" width="150" height="44" rx="4" fill="#ffffff" stroke="#1c2a4a" stroke-width="3" />
<g transform="translate(-175.5 0)"><g class="a drain"><g transform="translate(175.5 0)"><rect x="-258" y="-16" width="82.5" height="32" rx="0" fill="#c9a66b" stroke="none" stroke-width="5" /></g></g></g>
<g class="a plunge" style="--p:66px"><rect x="-300" y="-8" width="36" height="16" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-308" y="-26" width="10" height="52" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-270" y="-34" width="8" height="68" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" /></g></g></g>
<g class="a nudge" style="--dx:-12.1px;--dy:7.1px;animation-duration:1.6s"><path d="M500 310 L440 345" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<path d="M632 190 L515 300" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="515" cy="300" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="640" y="200" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >ponto: 1 cm acima e 1 cm lateral</text>
<text x="640" y="231" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >ao canto superolateral da patela</text>
<text x="640" y="320" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >agulha 21G, 45° para o centro,</text>
<text x="640" y="351" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >por baixo da patela (recesso suprapatelar)</text>
<circle cx="640" cy="431" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="662" y="440" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >joelho estendido, quadríceps relaxado</text>
<circle cx="640" cy="469" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="662" y="478" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >aspirar primeiro: líquido para análise</text>
<circle cx="640" cy="507" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="662" y="516" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >derrame grande: empurrar o líquido com a outra mão</text>
<circle cx="640" cy="545" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="662" y="554" font-size="17" text-anchor="start" font-weight="500" fill="#1c2a4a" >infiltrar só depois de aspirar; não se houver infecção</text>
<text x="640" y="660" font-size="19" text-anchor="start" font-weight="500" fill="#6b7280" >falhou? deslize a agulha lateralmente sob a patela;</text>
<text x="640" y="692" font-size="25" text-anchor="start" font-weight="500" fill="#6b7280" >se bater no osso, recuar e angular mais</text>
<text x="40" y="56" font-size="24" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Joelho, via superolateral: 1 cm acima e lateral à patela, agulha por baixo dela</text>
</svg>