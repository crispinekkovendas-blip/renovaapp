<rect x="62" y="702" width="436" height="56" rx="0" fill="#2a3140" stroke="none" stroke-width="5" />
<text x="80" y="150" font-size="28" text-anchor="start" font-weight="700" fill="#cfd6e3" >AP</text>
<text x="80" y="740" font-size="24" text-anchor="start" font-weight="500" fill="#cfd6e3" >duas incidências, sempre</text>
<circle cx="560" cy="160" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="171" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >A</text>
<text x="610" y="172" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Alinhamento</text>
<text x="610" y="212" font-size="25" text-anchor="start" font-weight="500" fill="#6b7280" >eixo do osso e das articulações; luxação?</text>
<circle cx="560" cy="290" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="301" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >B</text>
<text x="610" y="302" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Bone — o osso</text>
<text x="610" y="342" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >siga a cortical com o olho: degrau,</text>
<text x="610" y="374" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >interrupção, zona escura = fratura</text>
<circle cx="560" cy="450" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="461" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >C</text>
<text x="610" y="462" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Cartilagem — a articulação</text>
<text x="610" y="502" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >espaço articular simétrico? superfície</text>
<text x="610" y="534" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >articular contínua? (Salter-Harris na criança)</text>
<circle cx="560" cy="610" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="621" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >S</text>
<text x="610" y="622" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Soft tissue — partes moles</text>
<text x="610" y="662" font-size="23" text-anchor="start" font-weight="500" fill="#6b7280" >edema, derrame (coxim gorduroso no cotovelo),</text>
<text x="610" y="694" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >ar, corpo estranho</text>
<path d="M545 405 L480 405" fill="none" stroke="#8a6d3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="1150" y="760" font-size="24" text-anchor="end" font-weight="500" fill="#6b7280" >compare com o lado oposto na criança</text>
<text x="40" y="56" font-size="40" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Raio-X de trauma em 60 segundos: A · B · C · S</text>
</svg>