<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Leitura do raio-X de trauma</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<style>
/* Ciclo de 6 s para todos os movimentos; cada passo do procedimento ocupa uma fatia dele.
   Sem animação quando o leitor pede menos movimento e na impressão (o desenho parado é o procedimento completo). */
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.nudge{animation-name:nudge}
.draw{animation-name:draw}
.pulse{animation-name:pulse}
.blink{animation-name:blink}
.swing{animation-name:swing}
.push{animation-name:push}
.enter{animation-name:enter}
.enter2{animation-name:enter2}
.reduce{animation-name:reduce}
.flip{animation-name:flip}
.plunge{animation-name:plunge}
.drain{animation-name:drain}
.flow{animation-name:flow;animation-timing-function:linear}
.buzz{animation-name:buzz;animation-duration:.25s;animation-timing-function:linear}
.travel{animation-name:travel;animation-timing-function:linear}
.in1{animation-name:in1}.in2{animation-name:in2}.in3{animation-name:in3}
.out1{animation-name:out1}.out2{animation-name:out2}.out3{animation-name:out3}
.fade3{animation-name:fade3}
.squeeze{animation-name:squeeze}.pendulum{animation-name:pendulum}.tighten{animation-name:tighten}
.hi2{animation-name:hi2}.hi3{animation-name:hi3}.hi4{animation-name:hi4}
.focus2{animation-name:focus2}.focus3{animation-name:focus3}.focus4{animation-name:focus4}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes swing{0%,12%{transform:rotate(0)}55%,70%{transform:rotate(var(--a))}100%{transform:rotate(0)}}
@keyframes push{0%,12%{transform:translate(0,0)}55%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes enter{0%,8%{transform:translate(var(--dx),var(--dy))}38%,85%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes enter2{0%,8%{transform:translate(var(--dx),var(--dy))}30%,42%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45))}60%,88%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes reduce{0%,10%{transform:none}30%,40%{transform:translate(var(--dx),var(--dy))}55%,65%{transform:translate(var(--dx),var(--dy)) rotate(var(--a))}85%,100%{transform:none}}
@keyframes flip{0%,15%{transform:scaleY(1)}50%,70%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
@keyframes plunge{0%,45%{transform:translate(0,0)}80%,100%{transform:translate(var(--p),0)}}
@keyframes drain{0%,45%{transform:scaleX(1)}80%,100%{transform:scaleX(.2)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes buzz{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes travel{0%,8%{transform:translate(0,0)}92%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes in1{0%,18%{opacity:0}26%,100%{opacity:1}}
@keyframes in2{0%,42%{opacity:0}50%,100%{opacity:1}}
@keyframes in3{0%,66%{opacity:0}74%,100%{opacity:1}}
@keyframes out1{0%,22%{opacity:1}30%,100%{opacity:0}}
@keyframes out2{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes out3{0%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes pendulum{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes tighten{0%,15%{transform:scale(1,1)}55%,70%{transform:scale(.93,1)}100%{transform:scale(1,1)}}
@keyframes fade3{0%,66%{opacity:.75}80%,100%{opacity:.25}}
@keyframes hi2{0%{opacity:0}6%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes hi3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes hi4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes focus2{0%,44%{opacity:1}50%,94%{opacity:.35}100%{opacity:1}}
@keyframes focus3{0%,29%{opacity:1}33.3%,96%{opacity:.35}100%{opacity:1}}
@keyframes focus4{0%,22%{opacity:1}25%,97%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce),print{.a{animation:none!important}}
</style>
<rect x="60" y="100" width="440" height="660" rx="10" fill="#2a3140" stroke="#1c2a4a" stroke-width="4" />
<path d="M229.4 724 Q234.3 675.9 219.8 645.2 L244 409.3 Q264.5 382.2 269.4 334 A39.6 39.6 0 0 0 190.6 326 Q185.7 374.1 200.2 404.8 L176 640.7 Q155.5 667.8 150.6 716 A39.6 39.6 0 0 0 229.4 724 Z" fill="#d7dbe3" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M327 719.3 Q326.1 686.3 313.6 666.8 L306.4 392.4 Q317.9 372.3 317 339.3 A27 27 0 0 0 263 340.7 Q263.9 373.7 276.4 393.2 L283.6 667.6 Q272.1 687.7 273 720.7 A27 27 0 0 0 327 719.3 Z" fill="#d7dbe3" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="205" cy="290" r="22" fill="#d7dbe3" stroke="#2a3140" stroke-width="2" />
<circle cx="250" cy="285" r="22" fill="#d7dbe3" stroke="#2a3140" stroke-width="2" />
<circle cx="295" cy="292" r="22" fill="#d7dbe3" stroke="#2a3140" stroke-width="2" />
<circle cx="335" cy="300" r="22" fill="#d7dbe3" stroke="#2a3140" stroke-width="2" />
<path d="M192.8 247.6 Q189.9 225.8 180.2 213.8 L174.7 173.5 Q180.8 159.4 177.8 137.6 A18 18 0 0 0 142.2 142.4 Q145.1 164.2 154.8 176.2 L160.3 216.5 Q154.2 230.6 157.2 252.4 A18 18 0 0 0 192.8 247.6 Z" fill="#d7dbe3" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M242.9 238.5 Q241.1 216.6 232 204.1 L227.9 154.2 Q234.8 140.4 232.9 118.5 A18 18 0 0 0 197.1 121.5 Q198.9 143.4 208 155.9 L212.1 205.8 Q205.2 219.6 207.1 241.5 A18 18 0 0 0 242.9 238.5 Z" fill="#d7dbe3" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M288 239.3 Q287.1 217.3 278.6 204.4 L276.4 149.8 Q283.9 136.3 283 114.3 A18 18 0 0 0 247 115.7 Q247.9 137.7 256.4 150.6 L258.6 205.2 Q251.1 218.7 252 240.7 A18 18 0 0 0 288 239.3 Z" fill="#d7dbe3" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M333 250.7 Q333.9 228.7 326.4 215.2 L328.6 160.6 Q337.1 147.7 338 125.7 A18 18 0 0 0 302 124.3 Q301.1 146.3 308.6 159.8 L306.4 214.4 Q297.9 227.3 297 249.3 A18 18 0 0 0 333 250.7 Z" fill="#d7dbe3" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M367.5 269.2 Q372.6 247.8 367.9 233.1 L376.6 196.6 Q387.4 185.6 392.5 164.2 A18 18 0 0 0 357.5 155.8 Q352.4 177.2 357.1 191.9 L348.4 228.4 Q337.6 239.4 332.5 260.8 A18 18 0 0 0 367.5 269.2 Z" fill="#d7dbe3" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M198 420 L236 404 L232 386" fill="none" stroke="#b3261e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<g transform="translate(220 405)"><g class="a pulse" style="animation-duration:2.5s"><g transform="translate(-220 -405)"><circle cx="220" cy="405" r="46" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-dasharray="12 10"/></g></g></g>
<rect x="62" y="702" width="436" height="56" rx="0" fill="#2a3140" stroke="none" stroke-width="5" />
<text x="80" y="150" font-size="28" text-anchor="start" font-weight="700" fill="#cfd6e3" >AP</text>
<text x="80" y="740" font-size="24" text-anchor="start" font-weight="500" fill="#cfd6e3" >duas incidências, sempre</text>
<g class="a focus4" style="animation-delay:-6s"><circle cx="560" cy="160" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="171" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >A</text>
<text x="610" y="172" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Alinhamento</text>
<text x="610" y="212" font-size="25" text-anchor="start" font-weight="500" fill="#6b7280" >eixo do osso e das articulações; luxação?</text></g>
<g class="a focus4" style="animation-delay:-4.5s"><circle cx="560" cy="290" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="301" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >B</text>
<text x="610" y="302" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Bone — o osso</text>
<text x="610" y="342" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >siga a cortical com o olho: degrau,</text>
<text x="610" y="374" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >interrupção, zona escura = fratura</text></g>
<g class="a focus4" style="animation-delay:-3s"><circle cx="560" cy="450" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="461" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >C</text>
<text x="610" y="462" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Cartilagem — a articulação</text>
<text x="610" y="502" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >espaço articular simétrico? superfície</text>
<text x="610" y="534" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >articular contínua? (Salter-Harris na criança)</text></g>
<g class="a focus4" style="animation-delay:-1.5s"><circle cx="560" cy="610" r="24" fill="#1c2a4a" stroke="#1c2a4a" stroke-width="2" />
<text x="560" y="621" font-size="30" text-anchor="middle" font-weight="700" fill="#ffffff" >S</text>
<text x="610" y="622" font-size="34" text-anchor="start" font-weight="700" fill="#1c2a4a" >Soft tissue — partes moles</text>
<text x="610" y="662" font-size="23" text-anchor="start" font-weight="500" fill="#6b7280" >edema, derrame (coxim gorduroso no cotovelo),</text>
<text x="610" y="694" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >ar, corpo estranho</text></g>
<g class="a nudge" style="--dx:-14px;--dy:0px;animation-duration:1.6s"><path d="M545 405 L480 405" fill="none" stroke="#8a6d3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="1150" y="760" font-size="24" text-anchor="end" font-weight="500" fill="#6b7280" >compare com o lado oposto na criança</text>
<text x="40" y="56" font-size="40" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Raio-X de trauma em 60 segundos: A · B · C · S</text>
</svg>