<rect x="-308" y="-16" width="82.5" height="32" rx="0" fill="#c9a66b" stroke="none" stroke-width="5" />
<rect x="-350" y="-8" width="36" height="16" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-358" y="-26" width="10" height="52" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" />
<rect x="-320" y="-34" width="8" height="68" rx="0" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="2" /></g>
<path d="M600 352 L540 300" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahr)"/>
<path d="M752 190 L620 360" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="620" cy="360" r="7" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="760" y="200" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >2 cm abaixo e 1 cm medial ao ângulo</text>
<text x="760" y="231" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >posterolateral do acrômio</text>
<text x="760" y="300" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >agulha 21G longa (5 cm), para o</text>
<text x="760" y="331" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >processo coracoide; sente a cápsula</text>
<text x="760" y="362" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >'pop' e entra sem resistência</text>
<circle cx="760" cy="471" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="480" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >capsulite: triancinolona 40 mg + 4–6 mL</text>
<circle cx="760" cy="513" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="522" font-size="17" text-anchor="start" font-weight="500" fill="#1c2a4a" >bateu no osso? é a cabeça ou a glenoide:</text>
<text x="782" y="545" font-size="17" text-anchor="start" font-weight="500" fill="#1c2a4a" >   recuar e reangular medialmente</text>
<circle cx="760" cy="585" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="594" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >pode aspirar líquido para confirmar</text>
<circle cx="760" cy="627" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="782" y="636" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >fisioterapia nos dias seguintes</text>
<text x="40" y="56" font-size="29" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Glenoumeral, via posterior: mesmo ponto, mais fundo, até a cápsula</text>
</svg>