<text x="660" y="170" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >ponto: na prega proximal do punho,</text>
<text x="660" y="201" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >logo ulnar ao palmar longo</text>
<text x="660" y="232" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >(feche o punho para vê-lo)</text>
<text x="660" y="310" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >agulha 25G a 30°, apontando</text>
<text x="660" y="341" font-size="25" text-anchor="start" font-weight="500" fill="#1c2a4a" >para o dedo médio; 1–2 cm</text>
<circle cx="720" cy="421" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="742" y="430" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >parestesia ao entrar = no nervo: recuar</text>
<circle cx="720" cy="461" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="742" y="470" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >sem resistência: 1 mL corticoide</text>
<text x="742" y="499" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >   + 1 mL lidocaína</text>
<circle cx="720" cy="530" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="742" y="539" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >sem palmar longo? 1 cm ulnar à linha média</text>
<circle cx="720" cy="570" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="742" y="579" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >tala noturna depois; alívio em dias</text>
<text x="40" y="56" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Túnel do carpo: ulnar ao palmar longo, 30°, agulha para a palma</text>
</svg>