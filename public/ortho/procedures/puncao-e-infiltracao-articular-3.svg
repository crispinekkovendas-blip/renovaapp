<path d="M44 12 L114 12" fill="none" stroke="url(#hg27f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 36 L100 36" fill="none" stroke="url(#hg27f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-34 -46 L4 -92" fill="none" stroke="url(#hg27f)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" /></g>
