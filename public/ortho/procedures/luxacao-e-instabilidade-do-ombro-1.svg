<text x="820" y="201" font-size="19" text-anchor="start" font-weight="500" fill="#6b7280" >no sentido oposto; você traciona o</text>
<text x="820" y="227" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >braço em leve abdução</text>
<text x="820" y="650" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >tração contínua 2–5 min, sem</text>
<text x="820" y="676" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >puxão; sedação</text>
<text x="40" y="56" font-size="38" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Luxação anterior do ombro: três manobras sem força</text>
