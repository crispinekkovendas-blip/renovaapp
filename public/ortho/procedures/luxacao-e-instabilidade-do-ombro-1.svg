<text x="60" y="180" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >deitado, cotovelo colado ao corpo</text>
<text x="60" y="207" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >a 90°; rode o antebraço para fora</text>
<text x="60" y="234" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >bem devagar (1–2 min), parando</text>
<text x="60" y="261" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >quando doer; sem tração</text>
<text x="60" y="320" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >reduz a 70–110° de rotação externa;</text>
<text x="60" y="346" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >se não, levante o braço devagar</text>
<text x="60" y="372" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >em abdução (Milch)</text>
<rect x="420" y="90" width="360" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="442" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >2 · Cunningham</text>
<text x="440" y="175" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >paciente sentado, braço junto</text>
<text x="440" y="201" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >ao corpo, cotovelo a 90°, a mão</text>
<text x="440" y="227" font-size="20" text-anchor="start" font-weight="500" fill="#6b7280" >dele apoiada no seu ombro</text>
