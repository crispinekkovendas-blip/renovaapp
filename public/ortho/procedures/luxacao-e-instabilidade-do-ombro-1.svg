<text x="440" y="720" font-size="19" text-anchor="start" font-weight="500" fill="#6b7280" >trás, sente-se reto'; o ombro</text>
<text x="440" y="745" font-size="19" text-anchor="start" font-weight="500" fill="#6b7280" >entra sozinho</text>
