<path d="M242.5 381.4 L377.5 405.4" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M242.5 424.3 L377.5 448.3" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M242.5 467.1 L377.5 491.1" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M242.5 510 L377.5 510" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" /></g>
<text x="70" y="700" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >do pé (ponta dos dedos) até 2 dedos abaixo</text>
<text x="70" y="729" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >do joelho; 12–15 camadas</text>
<rect x="600" y="90" width="560" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="622" y="134" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" >De frente: estribo em U</text>
