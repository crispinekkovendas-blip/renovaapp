<path d="M810 530 L950 530" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" /></g>
<text x="620" y="700" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >o U passa por baixo do calcanhar e sobe</text>
<text x="620" y="729" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >pelos dois lados: trava a inversão/eversão</text>
