<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Tala de alinhamento da perna</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<style>
/* Ciclo de 6 s para todos os movimentos; cada passo do procedimento ocupa uma fatia dele.
   Sem animação quando o leitor pede menos movimento e na impressão (o desenho parado é o procedimento completo). */
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.nudge{animation-name:nudge}
.draw{animation-name:draw}
.pulse{animation-name:pulse}
.blink{animation-name:blink}
.swing{animation-name:swing}
.push{animation-name:push}
.enter{animation-name:enter}
.enter2{animation-name:enter2}
.reduce{animation-name:reduce}
.flip{animation-name:flip}
.plunge{animation-name:plunge}
.drain{animation-name:drain}
.flow{animation-name:flow;animation-timing-function:linear}
.buzz{animation-name:buzz;animation-duration:.25s;animation-timing-function:linear}
.travel{animation-name:travel;animation-timing-function:linear}
.in1{animation-name:in1}.in2{animation-name:in2}.in3{animation-name:in3}
.out1{animation-name:out1}.out2{animation-name:out2}.out3{animation-name:out3}
.fade3{animation-name:fade3}
.squeeze{animation-name:squeeze}.pendulum{animation-name:pendulum}.tighten{animation-name:tighten}
.hi2{animation-name:hi2}.hi3{animation-name:hi3}.hi4{animation-name:hi4}
.focus2{animation-name:focus2}.focus3{animation-name:focus3}.focus4{animation-name:focus4}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes swing{0%,12%{transform:rotate(0)}55%,70%{transform:rotate(var(--a))}100%{transform:rotate(0)}}
@keyframes push{0%,12%{transform:translate(0,0)}55%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes enter{0%,8%{transform:translate(var(--dx),var(--dy))}38%,85%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes enter2{0%,8%{transform:translate(var(--dx),var(--dy))}30%,42%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45))}60%,88%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes reduce{0%,10%{transform:none}30%,40%{transform:translate(var(--dx),var(--dy))}55%,65%{transform:translate(var(--dx),var(--dy)) rotate(var(--a))}85%,100%{transform:none}}
@keyframes flip{0%,15%{transform:scaleY(1)}50%,70%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
@keyframes plunge{0%,45%{transform:translate(0,0)}80%,100%{transform:translate(var(--p),0)}}
@keyframes drain{0%,45%{transform:scaleX(1)}80%,100%{transform:scaleX(.2)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes buzz{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes travel{0%,8%{transform:translate(0,0)}92%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes in1{0%,18%{opacity:0}26%,100%{opacity:1}}
@keyframes in2{0%,42%{opacity:0}50%,100%{opacity:1}}
@keyframes in3{0%,66%{opacity:0}74%,100%{opacity:1}}
@keyframes out1{0%,22%{opacity:1}30%,100%{opacity:0}}
@keyframes out2{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes out3{0%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes pendulum{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes tighten{0%,15%{transform:scale(1,1)}55%,70%{transform:scale(.93,1)}100%{transform:scale(1,1)}}
@keyframes fade3{0%,66%{opacity:.75}80%,100%{opacity:.25}}
@keyframes hi2{0%{opacity:0}6%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes hi3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}
@keyframes hi4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes focus2{0%,44%{opacity:1}50%,94%{opacity:.35}100%{opacity:1}}
@keyframes focus3{0%,29%{opacity:1}33.3%,96%{opacity:.35}100%{opacity:1}}
@keyframes focus4{0%,22%{opacity:1}25%,97%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce),print{.a{animation:none!important}}
</style>
<g class="a in1"><path d="M300 150 L330 150 L330 640 Q330 664 360 668 L540 674 L540 700 L350 694 Q296 688 296 640 Z" fill="#fbf8f2" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M300 150 L330 150 L330 640 Q330 664 360 668 L540 674 L540 700 L350 694 Q296 688 296 640 Z" fill="url(#cotton)" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g>
<g class="a in2"><path d="M262 150 L296 150 L296 642 Q296 696 350 702 L546 708 L546 746 L340 740 Q262 730 262 650 Z" fill="#ece7dc" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M262 150 L296 150 L296 642 Q296 696 350 702 L546 708 L546 746 L340 740 Q262 730 262 650 Z" fill="url(#hatch)" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g>
<path d="M380 150 L380 360" fill="none" stroke="#1c2a4a" stroke-width="160" stroke-linecap="round" stroke-linejoin="round" />
<path d="M380 360 L380 600" fill="none" stroke="#1c2a4a" stroke-width="135" stroke-linecap="round" stroke-linejoin="round" />
<path d="M380 150 L380 360" fill="none" stroke="#f3e4d3" stroke-width="150" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg31" gradientUnits="userSpaceOnUse" x1="455" y1="255" x2="305" y2="255"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M380 150 L380 360" fill="none" stroke="url(#cg31)" stroke-width="150" stroke-linecap="round" stroke-linejoin="round" />
<path d="M380 360 L380 600" fill="none" stroke="#f3e4d3" stroke-width="125" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg32" gradientUnits="userSpaceOnUse" x1="442.5" y1="480" x2="317.5" y2="480"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M380 360 L380 600" fill="none" stroke="url(#cg32)" stroke-width="125" stroke-linecap="round" stroke-linejoin="round" />
<g transform="translate(380 640) rotate(0) scale(1.15)"><defs><linearGradient id="fg33" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.45" stop-color="#f3e4d3"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs><path d="M-30 -50 L-36 0 Q-30 30 10 36 L150 40 Q172 36 172 20 Q168 4 140 0 L60 -12 Q40 -30 36 -60 Z" fill="url(#fg33)" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g>
<g class="a blink" style="animation-duration:2s"><path d="M432.5 457.5 L415 502.5 L397.5 457.5 L380 502.5 L362.5 457.5 L345 502.5 L327.5 457.5" fill="none" stroke="#b3261e" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter" /></g>
<path d="M340 440 L420 440" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" />
<g class="a in3"><path d="M297.5 180 L462.5 212.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 221 L462.5 253.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 262 L462.5 294.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 303 L462.5 335.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 344 L462.5 376.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 385 L462.5 417.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 426 L462.5 458.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 467 L462.5 499.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 508 L462.5 540.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 549 L462.5 581.8" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
<path d="M297.5 590 L462.5 590" fill="none" stroke="#1c2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" /></g>
<g class="a nudge" style="--dx:0px;--dy:-12px;animation-duration:1.6s"><path d="M380 760 L380 712" fill="none" stroke="#8a6d3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="430" y="760" font-size="24" text-anchor="start" font-weight="700" fill="#8a6d3b" >tração suave e contínua no calcanhar</text>
<text x="640" y="150" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >1. analgesia (bloqueio ou sedação) antes</text>
<text x="640" y="180" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >2. ajudante segura a coxa; você traciona pelo</text>
<text x="640" y="210" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >   calcanhar e corrige a angulação olhando o eixo</text>
<text x="640" y="240" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >3. tala posterior da raiz da coxa ao pé,</text>
<text x="640" y="270" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >   joelho em leve flexão (10–20°), tornozelo 90°</text>
<text x="640" y="300" font-size="21" text-anchor="start" font-weight="500" fill="#1c2a4a" >4. atadura sem apertar; checar pulso pedioso e</text>
<text x="640" y="330" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >   sensibilidade antes e depois</text>
<text x="640" y="360" font-size="24" text-anchor="start" font-weight="500" fill="#1c2a4a" >5. raio-X de controle com a tala</text>
<text x="640" y="560" font-size="17" text-anchor="start" font-weight="500" fill="#6b7280" >exposta? antibiótico e curativo primeiro, depois a tala.</text>
<text x="640" y="592" font-size="16" text-anchor="start" font-weight="500" fill="#6b7280" >Dor desproporcional após a tala = síndrome compartimental:</text>
<text x="640" y="624" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >abrir tudo.</text>
<text x="40" y="56" font-size="29" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Tala longa de perna: alinhar com tração e imobilizar da coxa ao pé</text>
</svg>