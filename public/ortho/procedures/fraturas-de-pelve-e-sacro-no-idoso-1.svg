<path d="M400 470 L330 760" fill="none" stroke="url(#cg83)" stroke-width="90" stroke-linecap="round" stroke-linejoin="round" />
<path d="M580 470 L650 760" fill="none" stroke="#1c2a4a" stroke-width="100" stroke-linecap="round" stroke-linejoin="round" />
<path d="M580 470 L650 760" fill="none" stroke="#f3e4d3" stroke-width="90" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg84" gradientUnits="userSpaceOnUse" x1="658.7" y1="604.4" x2="571.3" y2="625.6"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M580 470 L650 760" fill="none" stroke="url(#cg84)" stroke-width="90" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="400" cy="470" r="44" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" />
<circle cx="580" cy="470" r="44" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" />
<circle cx="330" cy="480" r="26" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" />
<circle cx="650" cy="480" r="26" fill="#f8f5ef" stroke="#1c2a4a" stroke-width="5" />
<text x="300" y="440" font-size="20" text-anchor="end" font-weight="500" fill="#1c2a4a" >trocânter</text>
<text x="680" y="440" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >trocânter</text>
<circle cx="260" cy="200" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="3" />
<circle cx="720" cy="200" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="3" />
<text x="230" y="180" font-size="22" text-anchor="end" font-weight="500" fill="#b3261e" >crista ilíaca ✗</text>
<text x="750" y="180" font-size="22" text-anchor="start" font-weight="500" fill="#b3261e" >✗ crista ilíaca</text>
<g transform="translate(490 495)"><g class="a tighten"><g transform="translate(-490 -495)"><path d="M240 450 L740 450 L740 540 L240 540 Z" fill="#d7dde8" stroke="#1c2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M240 450 L740 450 L740 540 L240 540 Z" fill="url(#cloth)" stroke="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M470 450 L450 540 M510 450 L530 540" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="455" y="480" width="70" height="30" rx="6" fill="#9aa3b5" stroke="#1c2a4a" stroke-width="3" /></g></g></g>
<text x="490" y="580" font-size="22" text-anchor="middle" font-weight="500" fill="#6b7280" >torcer e prender (pinças ou nó)</text>
<g class="a nudge" style="--dx:14px;--dy:0px;animation-duration:1.6s"><path d="M160 495 L236 495" fill="none" stroke="#8a6d3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<g class="a nudge" style="--dx:-14px;--dy:0px;animation-duration:1.6s"><path d="M820 495 L744 495" fill="none" stroke="#8a6d3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<circle cx="800" cy="241" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="250" font-size="15" text-anchor="start" font-weight="500" fill="#1c2a4a" >lençol dobrado em 30 cm ou cinta comercial</text>
<circle cx="800" cy="279" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="288" font-size="16" text-anchor="start" font-weight="500" fill="#1c2a4a" >centro atrás, no nível dos trocânteres</text>
<circle cx="800" cy="317" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="326" font-size="16" text-anchor="start" font-weight="500" fill="#1c2a4a" >cruzar na frente, apertar firme, prender</text>
<circle cx="800" cy="355" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="364" font-size="15" text-anchor="start" font-weight="500" fill="#1c2a4a" >joelhos juntos com faixa (rotação interna)</text>
<circle cx="800" cy="393" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="402" font-size="16" text-anchor="start" font-weight="500" fill="#1c2a4a" >não retirar antes da tomografia/cirurgia</text>
<circle cx="800" cy="431" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="440" font-size="23" text-anchor="start" font-weight="500" fill="#1c2a4a" >pele a cada 4–6 h</text>
<text x="800" y="520" font-size="19" text-anchor="start" font-weight="500" fill="#6b7280" >pelve 'em livro aberto' (compressão</text>
<text x="800" y="552" font-size="19" text-anchor="start" font-weight="500" fill="#6b7280" >AP): a cinta fecha o anel e reduz o</text>
<text x="800" y="584" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >sangramento venoso</text>
<text x="40" y="56" font-size="26" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Pelve instável: cinta ou lençol no nível dos trocânteres, não nas cristas</text>
</svg>