<text x="822" y="160" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >Gartland I: tala 3 semanas</text>
<circle cx="800" cy="195" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="204" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >II e III: tala só para transportar,</text>
<text x="822" y="228" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >   cirurgia pela regulação hoje</text>
<circle cx="800" cy="267" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="276" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >sem pulso e mão branca: reduzir</text>
<text x="822" y="300" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >   a flexão; não melhora = urgência</text>
<circle cx="800" cy="339" r="6" fill="#8a6d3b" stroke="#ffffff" stroke-width="3" />
<text x="822" y="348" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >elevar; raio-X com a tala</text>
<text x="40" y="56" font-size="26" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Supracondiliana: tala posterior de cotovelo a ≤ 90°, pulso antes e depois</text>
