<text x="822" y="276" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >sem pulso e mão branca: reduzir</text>
<text x="822" y="300" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >   a flexão; não melhora = urgência</text>
