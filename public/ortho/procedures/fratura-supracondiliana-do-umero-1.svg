<text x="822" y="204" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >II e III: tala só para transportar,</text>
<text x="822" y="228" font-size="18" text-anchor="start" font-weight="500" fill="#1c2a4a" >   cirurgia pela regulação hoje</text>
