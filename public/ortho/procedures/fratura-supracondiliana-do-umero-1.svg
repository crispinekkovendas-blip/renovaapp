<text x="640" y="700" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >pulso radial, enchimento capilar,</text>
<text x="640" y="728" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >mediano/radial/ulnar: antes e depois</text>
