<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Profilaxia do tétano</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d3b"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2a4a"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2a4a" stroke-opacity="0.18" stroke-width="3"/></pattern>
  <pattern id="cotton" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1c2a4a" fill-opacity="0.12"/></pattern>
  <pattern id="cloth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 H16 M8 0 V16" stroke="#1c2a4a" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<rect x="60" y="120" width="1080" height="90" rx="12" fill="#d7dde8" stroke="#1c2a4a" stroke-width="3" />
<text x="600" y="176" font-size="30" text-anchor="middle" font-weight="700" fill="#1c2a4a" >Quantas doses de vacina antitetânica na vida? Última quando?</text>
<path d="M230 215 L230 260" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahn)"/>
<rect x="60" y="260" width="340" height="110" rx="12" fill="#ffffff" stroke="#1c2a4a" stroke-width="3" />
<text x="80" y="302" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >3 doses ou mais</text>
<text x="80" y="334" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >última &lt; 5 anos</text>
<path d="M230 372 L230 410" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahn)"/>
<rect x="60" y="410" width="340" height="230" rx="12" fill="#2f6b4f" stroke="#2f6b4f" stroke-width="3" />
<text x="230" y="470" font-size="44" text-anchor="middle" font-weight="800" fill="#ffffff" >NADA</text>
<text x="230" y="520" font-size="24" text-anchor="middle" font-weight="500" fill="#ffffff" >nem vacina, nem soro</text>
<path d="M600 215 L600 260" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahn)"/>
<rect x="430" y="260" width="340" height="110" rx="12" fill="#ffffff" stroke="#1c2a4a" stroke-width="3" />
<text x="450" y="302" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >3 doses ou mais</text>
<text x="450" y="334" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >última há 5 anos ou mais</text>
<path d="M600 372 L600 410" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahn)"/>
<rect x="430" y="410" width="340" height="230" rx="12" fill="#8a6d3b" stroke="#8a6d3b" stroke-width="3" />
<text x="600" y="470" font-size="44" text-anchor="middle" font-weight="800" fill="#ffffff" >dT</text>
<text x="600" y="520" font-size="24" text-anchor="middle" font-weight="500" fill="#ffffff" >1 dose de reforço agora</text>
<path d="M970 215 L970 260" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahn)"/>
<rect x="800" y="260" width="340" height="110" rx="12" fill="#ffffff" stroke="#1c2a4a" stroke-width="3" />
<text x="820" y="302" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >menos de 3 doses,</text>
<text x="820" y="334" font-size="26" text-anchor="start" font-weight="500" fill="#6b7280" >não sabe ou nenhuma</text>
<path d="M970 372 L970 410" fill="none" stroke="#1c2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahn)"/>
<rect x="800" y="410" width="340" height="230" rx="12" fill="#b3261e" stroke="#b3261e" stroke-width="3" />
<text x="970" y="470" font-size="44" text-anchor="middle" font-weight="800" fill="#ffffff" >dT + IGHAT</text>
<text x="970" y="520" font-size="24" text-anchor="middle" font-weight="500" fill="#ffffff" >vacina agora (completar</text>,<text x="970" y="552" font-size="24" text-anchor="middle" font-weight="500" fill="#ffffff" >o esquema) + imunoglobulina</text>,<text x="970" y="584" font-size="24" text-anchor="middle" font-weight="500" fill="#ffffff" >250 UI IM em outro local</text>
<text x="60" y="700" font-size="15" text-anchor="start" font-weight="500" fill="#6b7280" >IGHAT também, com qualquer história vacinal: imunodeprimido, desnutrido grave, idoso ou ferida que não terá o cuidado adequado (MS).</text>
<text x="60" y="732" font-size="22" text-anchor="start" font-weight="500" fill="#6b7280" >Sem IGHAT disponível: soro antitetânico 5.000 UI após teste. Registrar na ficha e no cartão.</text>
<text x="40" y="56" font-size="30" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Tétano na fratura exposta (ferida de alto risco): o que dar hoje</text>
</svg>