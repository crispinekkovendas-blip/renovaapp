<path d="M930 340 L970 440" fill="none" stroke="url(#cg125)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
<defs><linearGradient id="cg126" gradientUnits="userSpaceOnUse" x1="1003.5" y1="485.3" x2="956.5" y2="494.7"><stop offset="0" stop-color="#fbf3ea"/><stop offset="0.38" stop-color="#f3e4d3"/><stop offset="0.8" stop-color="#dfc0a3" stop-opacity="0.85"/><stop offset="1" stop-color="#dfc0a3"/></linearGradient></defs>
<path d="M970 440 L990 540" fill="none" stroke="url(#cg126)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
<g class="a draw"><path d="M930 250 Q1000 280 1000 360" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" pathLength="1" stroke-dasharray="1"/></g>
<text x="1010" y="250" font-size="24" text-anchor="start" font-weight="700" fill="#8a6d3b" >MF 70–90°</text>
<text x="1010" y="480" font-size="21" text-anchor="start" font-weight="700" fill="#8a6d3b" >IF estendidas</text>
<text x="650" y="300" font-size="24" text-anchor="start" font-weight="700" fill="#8a6d3b" >punho 20° extensão</text>
<text x="630" y="640" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >ligamentos colaterais da MF ficam</text>
<text x="630" y="668" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >esticados: a mão não enrijece.</text>
<text x="630" y="696" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >Qualquer tala de mão sai nessa posição</text>
<text x="40" y="56" font-size="40" text-anchor="start" font-weight="700" fill="#1c2a4a" data-top="1">Buddy taping e a posição segura da mão</text>
</svg>