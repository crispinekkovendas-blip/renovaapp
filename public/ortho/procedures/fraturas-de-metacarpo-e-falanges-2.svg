<path d="M44 36 L100 36" fill="none" stroke="#1c2a4a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 -36 L106 -36" fill="none" stroke="url(#hg122f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 -12 L118 -12" fill="none" stroke="url(#hg122f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 12 L114 12" fill="none" stroke="url(#hg122f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M44 36 L100 36" fill="none" stroke="url(#hg122f)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-34 -46 L4 -92" fill="none" stroke="url(#hg122f)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" /></g></g>
<g class="a in1"><rect x="222" y="420" width="120" height="26" rx="4" fill="#b9c3d4" stroke="#1c2a4a" stroke-width="3" /></g>
<g class="a in2"><rect x="222" y="330" width="120" height="26" rx="4" fill="#b9c3d4" stroke="#1c2a4a" stroke-width="3" /></g>
<text x="70" y="640" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >esparadrapo na falange proximal e na</text>
<text x="70" y="668" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >média; deixar a IFP livre para dobrar;</text>
<text x="70" y="696" font-size="22" text-anchor="start" font-weight="500" fill="#1c2a4a" >trocar quando molhar; 3 semanas</text>
<g class="a nudge" style="--dx:-12.5px;--dy:0px;animation-duration:1.6s"><path d="M400 380 L350 380" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></g>
<text x="405" y="390" font-size="20" text-anchor="start" font-weight="500" fill="#1c2a4a" >articulação livre</text>
<rect x="600" y="90" width="560" height="680" rx="14" fill="#ffffff" stroke="#e5e9f0" stroke-width="3" />
<text x="622" y="134" font-size="29" text-anchor="start" font-weight="700" fill="#1c2a4a" >Posição segura (intrínseco-plus)</text>
<path d="M640 380 L860 380" fill="none" stroke="#1c2a4a" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" />
<path d="M860 380 L930 340 L970 440 L990 540" fill="none" stroke="#1c2a4a" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" />
